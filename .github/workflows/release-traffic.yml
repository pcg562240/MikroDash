name: Publish traffic extension images
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Matching upstream version plus traffic revision, e.g. 0.8.55-traffic.1'
        required: true
permissions:
  contents: read
concurrency:
  group: publish-traffic-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci-zh.yml
  publish:
    needs: checks
    if: github.repository == 'pcg562240/MikroDash' && github.ref == 'refs/heads/zh-CN'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [dashboard, collector]
    steps:
      - uses: actions/checkout@v4
      - name: Validate traffic release and upstream version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const meta = JSON.parse(fs.readFileSync('localization/upstream.json', 'utf8'));
          const version = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+-traffic\.\d+$/.test(version) || !version.startsWith(meta.tag.slice(1) + '-traffic.')) throw Error('Traffic version must match the validated upstream');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nimage=${meta.image}\n`);
          JS
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.traffic
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: UPSTREAM_IMAGE=${{ steps.version.outputs.image }}
          push: true
          tags: ghcr.io/pcg562240/mikrodash-traffic-${{ matrix.target }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=traffic-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=traffic-${{ matrix.target }}
