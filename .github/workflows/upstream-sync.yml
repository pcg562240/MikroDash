name: Check upstream releases
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: upstream-release-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'pcg562240/MikroDash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zh-CN
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the latest stable release and open a review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node localization/sync-upstream.mjs
