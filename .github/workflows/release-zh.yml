name: Publish Chinese image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Chinese version, e.g. 0.8.55-zh.1 (never an upstream tag)'
        required: true
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci-zh.yml
  publish:
    needs: checks
    if: github.repository == 'pcg562240/MikroDash' && github.ref == 'refs/heads/zh-CN'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and matching upstream image
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const meta = JSON.parse(fs.readFileSync('localization/upstream.json', 'utf8'));
          const v = process.env.VERSION;
          if (!/^\d+\.\d+\.\d+-zh\.\d+$/.test(v) || !v.startsWith(meta.tag.slice(1) + '-zh.')) throw Error('Version must match upstream and have a zh revision');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${v}\nimage=${meta.image}\n`);
          JS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zh-CN
          platforms: linux/amd64,linux/arm64
          build-args: UPSTREAM_IMAGE=${{ steps.version.outputs.image }}
          push: true
          tags: |
            ghcr.io/pcg562240/mikrodash-zh:${{ steps.version.outputs.version }}
            ghcr.io/pcg562240/mikrodash-zh:latest
